name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Run only the production capacity preflight, or perform a full deployment after it passes.
        required: true
        type: choice
        default: preflight_only
        options:
          - preflight_only
          - deploy

permissions:
  contents: read
  packages: write

concurrency:
  group: production-mykinlegacy
  cancel-in-progress: false

jobs:
  deploy:
    name: Capacity preflight / production deploy
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_PROJECT_DIR: ${{ secrets.PROD_PROJECT_DIR }}
      DEPLOY_REQUESTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'deploy') }}
      REGISTRY: ghcr.io
      IMAGE_REPOSITORY: mykinlegacy-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production secrets
        shell: bash
        run: |
          : "${PROD_SSH_HOST:?Missing PROD_SSH_HOST}"
          : "${PROD_SSH_USER:?Missing PROD_SSH_USER}"
          : "${PROD_SSH_PORT:?Missing PROD_SSH_PORT}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${PROD_PROJECT_DIR:?Missing PROD_PROJECT_DIR}"

      - name: Prepare image metadata
        id: image_meta
        shell: bash
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME="${REGISTRY}/${OWNER_LOWER}/${IMAGE_REPOSITORY}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_IMAGE_LATEST=${IMAGE_NAME}:main" >> "$GITHUB_ENV"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_image_latest=${IMAGE_NAME}:main" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Configure SSH for capacity preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          raw = os.environ["PROD_SSH_PRIVATE_KEY"].strip()
          key = raw.replace("\\r", "").replace("\r", "").replace("\\n", "\n")
          if "BEGIN " not in key:
              try:
                  key = base64.b64decode(raw).decode("utf-8").replace("\r", "").replace("\\n", "\n")
              except Exception:
                  pass
          if "BEGIN " not in key:
              print("Invalid production SSH key.", file=sys.stderr)
              sys.exit(1)
          if not key.endswith("\n"):
              key += "\n"
          Path.home().joinpath(".ssh", "mykinlegacy_prod").write_text(key)
          PY
          chmod 600 ~/.ssh/mykinlegacy_prod
          ssh-keygen -y -f ~/.ssh/mykinlegacy_prod >/dev/null
          ssh-keyscan -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production capacity gate before build
        shell: bash
        run: |
          bash scripts/run-production-capacity-preflight.sh

      - name: Confirm preflight-only completion
        if: env.DEPLOY_REQUESTED != 'true'
        shell: bash
        run: |
          echo "PREFLIGHT_ONLY_COMPLETE build=false image_pull=false container_recreate=false deploy=false"

      - name: Set up Docker Buildx
        if: env.DEPLOY_REQUESTED == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.DEPLOY_REQUESTED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push production image
        id: build_push
        if: env.DEPLOY_REQUESTED == 'true'
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.app_image }}
            ${{ steps.image_meta.outputs.app_image_latest }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_SITE_URL=https://mykinlegacy.com
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-SD7D57WEH0
            APP_WEB_URL=https://mykinlegacy.com
            APP_BASE_URL=https://mykinlegacy.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Measure candidate image outside production
        id: candidate_image
        if: env.DEPLOY_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${APP_IMAGE}"
          unpacked_bytes="$(docker image inspect --format '{{.Size}}' "${APP_IMAGE}")"
          [[ "$unpacked_bytes" =~ ^[0-9]+$ ]] || {
            echo "CANDIDATE_IMAGE_SIZE_UNKNOWN value=$unpacked_bytes" >&2
            exit 78
          }
          echo "unpacked_bytes=$unpacked_bytes" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_IMAGE_MEASURED location=github_actions_runner image=${APP_IMAGE} unpacked_bytes=$unpacked_bytes"

      - name: Production capacity gate before VPS update
        if: env.DEPLOY_REQUESTED == 'true'
        shell: bash
        env:
          DEPLOY_CAPACITY_RUN_TYPE: pre_deploy_candidate
          DEPLOY_CANDIDATE_IMAGE_UNPACKED_BYTES: ${{ steps.candidate_image.outputs.unpacked_bytes }}
        run: |
          bash scripts/run-production-capacity-preflight.sh

      - name: Deploy on production VPS
        if: env.DEPLOY_REQUESTED == 'true'
        shell: bash
        timeout-minutes: 25
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          APP_IMAGE: ${{ steps.image_meta.outputs.app_image }}
          CANDIDATE_IMAGE_UNPACKED_BYTES: ${{ steps.candidate_image.outputs.unpacked_bytes }}
        run: |
          ssh -i ~/.ssh/mykinlegacy_prod \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'bash -s' -- "$PROD_PROJECT_DIR" "$APP_IMAGE" "$GHCR_USERNAME" "$GHCR_TOKEN" "$CANDIDATE_IMAGE_UNPACKED_BYTES" <<'REMOTE_SCRIPT'
          set -euo pipefail
          PROJECT_DIR="$1"
          APP_IMAGE="$2"
          GHCR_USERNAME="$3"
          GHCR_TOKEN="$4"
          CANDIDATE_IMAGE_UNPACKED_BYTES="$5"

          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cd "$PROJECT_DIR"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          RUN_SEED=false APP_IMAGE="$APP_IMAGE" \
            DEPLOY_CANDIDATE_IMAGE_UNPACKED_BYTES="$CANDIDATE_IMAGE_UNPACKED_BYTES" \
            bash deployment/deploy.sh
          bash deployment/status.sh
          REMOTE_SCRIPT
