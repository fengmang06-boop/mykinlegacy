name: Codex Etsy Production Channel Repair
# Recovery rerun after Vultr billing restoration: 2026-08-07.

on:
  push:
    branches:
      - codex/etsy-controlled-autonomous-repair-v3
    paths:
      - ".github/workflows/codex-etsy-production-channel-repair.yml"

permissions:
  contents: read

concurrency:
  group: mensskull-growth-os-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated production access
        shell: bash
        run: |
          set -euo pipefail
          : "${PROD_SSH_HOST:?Missing PROD_SSH_HOST}"
          : "${PROD_SSH_USER:?Missing PROD_SSH_USER}"
          : "${PROD_SSH_PORT:?Missing PROD_SSH_PORT}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64, os, sys
          from pathlib import Path
          raw = os.environ["PROD_SSH_PRIVATE_KEY"].strip()
          key = raw.replace("\\r", "").replace("\r", "").replace("\\n", "\n")
          if "BEGIN " not in key:
              try:
                  key = base64.b64decode(raw).decode("utf-8").replace("\\r", "").replace("\r", "").replace("\\n", "\n")
              except Exception:
                  pass
          if "BEGIN " not in key:
              print("Invalid private key", file=sys.stderr)
              sys.exit(1)
          if not key.endswith("\n"):
              key += "\n"
          Path.home().joinpath(".ssh", "prod").write_text(key)
          PY
          chmod 600 ~/.ssh/prod
          timeout 15 ssh-keyscan -T 5 -p "$PROD_SSH_PORT" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Collect recovery diagnostics
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(ssh -i ~/.ssh/prod \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          PM2_JSON="$(pm2 jlist 2>/dev/null)"
          DOCKER_JSON="$(docker ps -a --format '{{json .}}' 2>/dev/null | python3 -c 'import json,sys; print(json.dumps([json.loads(x) for x in sys.stdin if x.strip()], separators=(",",":")))')"
          NGINX_INSPECT="$(docker inspect mykinlegacy_nginx 2>/dev/null)"
          API_INSPECT="$(docker inspect mykinlegacy_api 2>/dev/null)"
          NGINX_LOGS="$(docker logs --tail 25 mykinlegacy_nginx 2>&1 | tail -n 25)"
          NGINX_UPSTREAMS="$(grep -nE 'upstream|server +(api|web|mykinlegacy_)' /root/mykinlegacy/deployment/nginx.conf 2>/dev/null | head -n 30)"
          LISTENING="$(ss -ltnH 2>/dev/null | awk '{print $4}' | grep -E ':(22|80|443|3000)$' | sort -u | paste -sd, -)"
          LOCAL_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/etsy/status 2>/dev/null || printf 000)"
          PM2_JSON="$PM2_JSON" DOCKER_JSON="$DOCKER_JSON" NGINX_INSPECT="$NGINX_INSPECT" API_INSPECT="$API_INSPECT" NGINX_LOGS="$NGINX_LOGS" NGINX_UPSTREAMS="$NGINX_UPSTREAMS" LISTENING="$LISTENING" LOCAL_STATUS="$LOCAL_STATUS" python3 - <<'PY'
          import json, os, shutil
          try:
              pm2 = json.loads(os.environ.get('PM2_JSON') or '[]')
          except Exception:
              pm2 = []
          process = next((p for p in pm2 if p.get('name') == 'mensskull-etsy-ai-manager'), None)
          try:
              containers = json.loads(os.environ.get('DOCKER_JSON') or '[]')
          except Exception:
              containers = []
          try:
              nginx = json.loads(os.environ.get('NGINX_INSPECT') or '[]')[0]
          except Exception:
              nginx = {}
          try:
              api = json.loads(os.environ.get('API_INSPECT') or '[]')[0]
          except Exception:
              api = {}
          def networks(container):
              return {name: {'aliases': data.get('Aliases'), 'ip': data.get('IPAddress')} for name, data in container.get('NetworkSettings', {}).get('Networks', {}).items()}
          payload = {
              'etsyPm2': {
                  'present': process is not None,
                  'status': (process or {}).get('pm2_env', {}).get('status', 'missing'),
                  'restarts': (process or {}).get('pm2_env', {}).get('restart_time'),
              },
              'localEtsyStatus': os.environ.get('LOCAL_STATUS'),
              'listening': os.environ.get('LISTENING', '').split(',') if os.environ.get('LISTENING') else [],
              'dockerService': os.popen('systemctl is-active docker 2>/dev/null').read().strip(),
              'containers': [{'name': c.get('Names'), 'state': c.get('State'), 'status': c.get('Status')} for c in containers],
              'nginx': {
                  'exitCode': nginx.get('State', {}).get('ExitCode'),
                  'error': nginx.get('State', {}).get('Error'),
                  'restartCount': nginx.get('RestartCount'),
                  'mounts': [{'source': m.get('Source'), 'destination': m.get('Destination'), 'mode': m.get('Mode')} for m in nginx.get('Mounts', [])],
                  'networks': networks(nginx),
                  'configuredUpstreams': os.environ.get('NGINX_UPSTREAMS', ''),
                  'logs': os.environ.get('NGINX_LOGS', '')[-4000:],
              },
              'apiNetworks': networks(api),
              'diskFreeGb': round(shutil.disk_usage('/').free / 1024**3, 2),
          }
          print('RECOVERY_DIAGNOSTIC_JSON=' + json.dumps(payload, separators=(',', ':')))
          print('RECOVERY_NETWORK_JSON=' + json.dumps({
              'nginxNetworks': networks(nginx),
              'apiNetworks': networks(api),
          }, separators=(',', ':')))
          PY
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          DIAGNOSTIC="$(printf '%s\n' "$OUTPUT" | sed -n 's/^RECOVERY_DIAGNOSTIC_JSON=//p' | tail -n 1)"
          test -n "$DIAGNOSTIC"
          MESSAGE="$(printf '%s' "$DIAGNOSTIC" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::notice title=Production recovery diagnostic::$MESSAGE"
          NETWORK_DIAGNOSTIC="$(printf '%s\n' "$OUTPUT" | sed -n 's/^RECOVERY_NETWORK_JSON=//p' | tail -n 1)"
          test -n "$NETWORK_DIAGNOSTIC"
          NETWORK_MESSAGE="$(printf '%s' "$NETWORK_DIAGNOSTIC" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::notice title=Production network diagnostic::$NETWORK_MESSAGE"

      - name: Diagnose and recover isolated Etsy channel
        id: repair
        shell: bash
        run: |
          set +e
          OUTPUT="$(ssh -i ~/.ssh/prod \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/root/mykinlegacy/mensskull-etsy-ai-manager
          PROCESS=mensskull-etsy-ai-manager
          test -d "$APP"
          test "$(realpath "$APP")" = "$APP"
          cd "$APP"

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/root/mensskull-etsy-backups/channel-repair/$STAMP"
          mkdir -p "$BACKUP"
          cp -a .env.local "$BACKUP/.env.local"
          cp -a prisma/dev.db "$BACKUP/dev.db"
          pm2 jlist > "$BACKUP/pm2-jlist.json"
          if [ -f /etc/nginx/sites-available/tools.mensskull.com ]; then
            cp -a /etc/nginx/sites-available/tools.mensskull.com "$BACKUP/tools.mensskull.com.nginx"
          fi

          # Fail closed and ensure this process cannot write to Etsy during recovery.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env.local')
          required = {'ETSY_READ_ONLY_MODE': 'true', 'ETSY_WRITE_APPROVED': 'false'}
          lines = path.read_text().splitlines()
          out, seen = [], set()
          for line in lines:
              key = line.split('=', 1)[0].strip() if '=' in line and not line.lstrip().startswith('#') else None
              if key in required:
                  if key not in seen:
                      out.append(f'{key}={required[key]}')
                      seen.add(key)
              else:
                  out.append(line)
          for key, value in required.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          path.write_text('\n'.join(out).rstrip() + '\n')
          path.chmod(0o600)
          PY
          grep -Eq '^ETSY_READ_ONLY_MODE=true$' .env.local
          grep -Eq '^ETSY_WRITE_APPROVED=false$' .env.local
          python3 - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path('.env.local').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip("'\"")
          if not values.get('DATABASE_URL', 'file:./dev.db').startswith('file:'):
              raise SystemExit('Etsy DATABASE_URL is not isolated SQLite')
          PY

          PM2_ACTION=none
          LOCAL_BEFORE=000
          if pm2 describe "$PROCESS" >/dev/null 2>&1; then
            LOCAL_BEFORE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/api/etsy/status || true)"
            PM2_STATUS="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==="mensskull-etsy-ai-manager");process.stdout.write(p?.pm2_env?.status||"missing")})')"
            if [ "$PM2_STATUS" != online ] || [ "$LOCAL_BEFORE" != 200 ]; then
              pm2 restart "$PROCESS" --update-env
              PM2_ACTION=restart
            fi
          else
            pm2 start npm --name "$PROCESS" -- start
            PM2_ACTION=start
          fi

          if [ "$PM2_ACTION" != none ]; then
            sleep 8
          fi
          LOCAL_AFTER="$(curl -sS -o /tmp/etsy-status.json -w '%{http_code}' --max-time 15 http://127.0.0.1:3000/api/etsy/status)"
          test "$LOCAL_AFTER" = 200
          node - <<'NODE'
          const status = require('/tmp/etsy-status.json');
          if (status?.env?.readOnlyMode !== true || status?.env?.writeApproved !== false) {
            throw new Error('Etsy safety guards are not restored');
          }
          NODE

          NGINX_ACTION=none
          NGINX_NETWORK_COUNT="$(docker inspect -f '{{len .NetworkSettings.Networks}}' mykinlegacy_nginx)"
          if [ "$NGINX_NETWORK_COUNT" = 0 ]; then
            API_NETWORK="$(docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' mykinlegacy_api | sed '/^$/d')"
            test "$(printf '%s\n' "$API_NETWORK" | wc -l)" = 1
            test "$API_NETWORK" = mykinlegacy_default
            docker inspect mykinlegacy_nginx > "$BACKUP/mykinlegacy_nginx-inspect-before.json"
            RESTART_POLICY="$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' mykinlegacy_nginx)"
            test -n "$RESTART_POLICY"
            docker update --restart=no mykinlegacy_nginx >/dev/null
            docker stop -t 5 mykinlegacy_nginx >/dev/null 2>&1 || true
            docker network connect "$API_NETWORK" mykinlegacy_nginx
            docker update --restart="$RESTART_POLICY" mykinlegacy_nginx >/dev/null
            docker start mykinlegacy_nginx >/dev/null
            NGINX_ACTION=reattach-network
            sleep 5
          fi
          if docker ps --format '{{.Names}}' | grep -Fxq mykinlegacy_nginx; then
            docker exec mykinlegacy_nginx nginx -t
            CONTAINER_TOOLS="$(curl -ksS --resolve tools.mensskull.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 15 https://tools.mensskull.com/api/etsy/status || true)"
            if [ "$CONTAINER_TOOLS" != 200 ]; then
              docker exec mykinlegacy_nginx nginx -s reload
              if [ "$NGINX_ACTION" = none ]; then
                NGINX_ACTION=reload
              else
                NGINX_ACTION="$NGINX_ACTION+reload"
              fi
              sleep 3
            fi
          else
            echo 'mykinlegacy_nginx is not running; refusing to recreate shared infrastructure' >&2
            exit 1
          fi

          TOOLS_STATUS="$(curl -ksS --resolve tools.mensskull.com:443:127.0.0.1 -o /tmp/tools-status.json -w '%{http_code}' --max-time 20 https://tools.mensskull.com/api/etsy/status)"
          TOOLS_PAGE="$(curl -ksS --resolve tools.mensskull.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 20 https://tools.mensskull.com/etsy-connection)"
          MYKIN_HEALTH="$(curl -ksS --resolve mykinlegacy.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 20 https://mykinlegacy.com/health)"
          test "$TOOLS_STATUS" = 200
          test "$TOOLS_PAGE" = 200
          test "$MYKIN_HEALTH" = 200

          python3 - "$BACKUP" "$PM2_ACTION" "$NGINX_ACTION" "$LOCAL_BEFORE" "$LOCAL_AFTER" "$TOOLS_STATUS" "$TOOLS_PAGE" "$MYKIN_HEALTH" <<'PY'
          import json, sys
          print('REPAIR_RESULT_JSON=' + json.dumps({
              'backup': sys.argv[1],
              'pm2Action': sys.argv[2],
              'nginxAction': sys.argv[3],
              'localBefore': sys.argv[4],
              'localAfter': sys.argv[5],
              'toolsStatus': sys.argv[6],
              'toolsPage': sys.argv[7],
              'mykinlegacyHealth': sys.argv[8],
              'readOnlyMode': True,
              'writeApproved': False,
              'dockerRecreated': False,
              'etsyModified': False,
          }, separators=(',', ':')))
          PY
          REMOTE
          )"
          STATUS="$?"
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(printf '%s' "$OUTPUT" | tail -n 30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Production recovery stopped safely::$MESSAGE"
            exit "$STATUS"
          fi
          RESULT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^REPAIR_RESULT_JSON=//p' | tail -n 1)"
          test -n "$RESULT"
          MESSAGE="$(printf '%s' "$RESULT" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::notice title=Production recovery result::$MESSAGE"

      - name: Verify from an independent network
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_STATUS="$(curl -sS -o /tmp/public-status.json -w '%{http_code}' --connect-timeout 8 --max-time 20 https://tools.mensskull.com/api/etsy/status)"
          TOOLS_PAGE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 https://tools.mensskull.com/etsy-connection)"
          MYKIN_HEALTH="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 https://mykinlegacy.com/health)"
          test "$TOOLS_STATUS" = 200
          test "$TOOLS_PAGE" = 200
          test "$MYKIN_HEALTH" = 200
          node - <<'NODE'
          const status = require('/tmp/public-status.json');
          if (status?.env?.readOnlyMode !== true || status?.env?.writeApproved !== false) {
            throw new Error('Public status does not confirm read-only guards');
          }
          NODE
          SUMMARY="$(printf '{\"toolsStatus\":%s,\"toolsPage\":%s,\"mykinlegacyHealth\":%s,\"readOnlyMode\":true,\"writeApproved\":false,\"etsyModified\":false}' "$TOOLS_STATUS" "$TOOLS_PAGE" "$MYKIN_HEALTH")"
          echo "::notice title=Production channel repair::$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
